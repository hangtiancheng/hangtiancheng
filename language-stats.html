<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Language stats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            keyframes: {
              slide: {
                "0%": { marginLeft: "-40%" },
                "100%": { marginLeft: "100%" },
              },
            },
            animation: { slide: "slide 1.1s ease-in-out infinite" },
          },
        },
      };
    </script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.js"></script>
  </head>

  <body
    class="bg-gray-50 text-gray-900 antialiased dark:bg-[#0d1117] dark:text-[#e6edf3]"
  >
    <main class="max-w-5xl mx-auto px-5 py-8">
      <header class="flex items-center gap-4 flex-wrap mb-5">
        <img
          id="avatar"
          alt=""
          class="hidden w-14 h-14 rounded-full border border-gray-200 dark:border-[#30363d]"
        />
        <div>
          <h1 id="title" class="m-0 text-xl font-semibold">Language stats</h1>
          <p class="mt-0.5 mb-0 text-[13px] text-gray-500 dark:text-[#8b949e]">
            <a
              id="user-link"
              href="#"
              target="_blank"
              rel="noopener"
              class="text-blue-600 hover:underline dark:text-[#58a6ff]"
            ></a>
          </p>
        </div>
        <div class="ml-auto flex items-center gap-2.5 flex-wrap">
          <label
            class="inline-flex items-center gap-1.5 text-[13px] text-gray-500 cursor-pointer select-none dark:text-[#8b949e]"
          >
            <input
              type="checkbox"
              id="skip-forks"
              checked
              class="accent-blue-600 dark:accent-[#58a6ff]"
            />
            skip forks
          </label>
          <label
            class="inline-flex items-center gap-1.5 text-[13px] text-gray-500 cursor-pointer select-none dark:text-[#8b949e]"
          >
            <input
              type="checkbox"
              id="skip-archived"
              checked
              class="accent-blue-600 dark:accent-[#58a6ff]"
            />
            skip archived
          </label>
          <button
            id="token-toggle"
            type="button"
            class="px-3 py-1.5 text-[13px] rounded-md border border-gray-300 bg-white text-gray-900 cursor-pointer hover:border-gray-500 disabled:opacity-50 disabled:cursor-default dark:border-[#30363d] dark:bg-[#161b22] dark:text-[#e6edf3] dark:hover:border-[#8b949e]"
          >
            API token
          </button>
          <button
            id="refresh"
            type="button"
            class="px-3 py-1.5 text-[13px] rounded-md border border-gray-300 bg-white text-gray-900 cursor-pointer hover:border-gray-500 disabled:opacity-50 disabled:cursor-default dark:border-[#30363d] dark:bg-[#161b22] dark:text-[#e6edf3] dark:hover:border-[#8b949e]"
          >
            Refresh
          </button>
        </div>
      </header>

      <section
        id="token-panel"
        class="hidden flex-wrap items-center gap-2 mb-4 rounded-lg border border-gray-200 bg-white p-4 dark:border-[#30363d] dark:bg-[#161b22]"
      >
        <input
          type="password"
          id="token-input"
          placeholder="GitHub personal access token (optional)"
          autocomplete="off"
          class="w-80 max-w-full px-2.5 py-1.5 text-[13px] rounded-md border border-gray-300 bg-gray-50 text-gray-900 dark:border-[#30363d] dark:bg-[#0d1117] dark:text-[#e6edf3]"
        />
        <button
          id="token-save"
          type="button"
          class="px-3 py-1.5 text-[13px] rounded-md border border-gray-300 bg-white text-gray-900 cursor-pointer hover:border-gray-500 disabled:opacity-50 disabled:cursor-default dark:border-[#30363d] dark:bg-[#161b22] dark:text-[#e6edf3] dark:hover:border-[#8b949e]"
        >
          Save &amp; refresh
        </button>
        <button
          id="token-clear"
          type="button"
          class="px-3 py-1.5 text-[13px] rounded-md border border-gray-300 bg-white text-gray-900 cursor-pointer hover:border-gray-500 disabled:opacity-50 disabled:cursor-default dark:border-[#30363d] dark:bg-[#161b22] dark:text-[#e6edf3] dark:hover:border-[#8b949e]"
        >
          Clear
        </button>
      </section>

      <div id="banner" class="hidden"></div>

      <div
        id="progress"
        class="hidden items-center gap-3 text-[13px] text-gray-500 mb-4 dark:text-[#8b949e]"
      >
        <span id="progress-text">Loading…</span>
        <span
          class="flex-1 h-[3px] rounded-sm bg-gray-200 overflow-hidden dark:bg-[#30363d]"
        >
          <span
            class="block h-full w-2/5 rounded-sm bg-blue-600 animate-slide dark:bg-[#58a6ff]"
          ></span>
        </span>
      </div>

      <section class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
        <div
          class="rounded-lg border border-gray-200 bg-white p-4 dark:border-[#30363d] dark:bg-[#161b22]"
        >
          <div class="text-xs text-gray-500 mb-1 dark:text-[#8b949e]">
            Repositories scanned
          </div>
          <div
            class="text-xl font-semibold flex items-center gap-2"
            id="stat-repos"
          >
            –
          </div>
        </div>
        <div
          class="rounded-lg border border-gray-200 bg-white p-4 dark:border-[#30363d] dark:bg-[#161b22]"
        >
          <div class="text-xs text-gray-500 mb-1 dark:text-[#8b949e]">
            Languages
          </div>
          <div
            class="text-xl font-semibold flex items-center gap-2"
            id="stat-langs"
          >
            –
          </div>
        </div>
        <div
          class="rounded-lg border border-gray-200 bg-white p-4 dark:border-[#30363d] dark:bg-[#161b22]"
        >
          <div class="text-xs text-gray-500 mb-1 dark:text-[#8b949e]">
            Total code size
          </div>
          <div
            class="text-xl font-semibold flex items-center gap-2"
            id="stat-size"
          >
            –
          </div>
        </div>
        <div
          class="rounded-lg border border-gray-200 bg-white p-4 dark:border-[#30363d] dark:bg-[#161b22]"
        >
          <div class="text-xs text-gray-500 mb-1 dark:text-[#8b949e]">
            Top language
          </div>
          <div
            class="text-xl font-semibold flex items-center gap-2"
            id="stat-top"
          >
            –
          </div>
        </div>
      </section>

      <section class="grid md:grid-cols-2 gap-3 mb-4">
        <div
          class="rounded-lg border border-gray-200 bg-white p-4 dark:border-[#30363d] dark:bg-[#161b22]"
        >
          <h2 class="m-0 mb-3 text-sm font-semibold">Language share</h2>
          <div class="relative h-80"><canvas id="donut"></canvas></div>
        </div>
        <div
          class="rounded-lg border border-gray-200 bg-white p-4 dark:border-[#30363d] dark:bg-[#161b22]"
        >
          <h2 class="m-0 mb-3 text-sm font-semibold">Top languages by size</h2>
          <div class="relative h-80"><canvas id="bar"></canvas></div>
        </div>
      </section>

      <section
        class="rounded-lg border border-gray-200 bg-white p-4 dark:border-[#30363d] dark:bg-[#161b22]"
      >
        <h2 class="m-0 mb-3 text-sm font-semibold">Largest repositories</h2>
        <div id="repos"></div>
      </section>
    </main>

    <noscript
      ><p class="max-w-5xl mx-auto px-5 text-red-600 dark:text-[#ff7b72]">
        This panel requires JavaScript.
      </p></noscript
    >

    <script>
      "use strict";

      /* ---------- config ---------- */
      const params = new URLSearchParams(location.search);
      const USER = (params.get("user") || "hangtiancheng").replace(
        /[^a-zA-Z0-9-]/g,
        "",
      );
      const API = "https://api.github.com";
      const CACHE_KEY = "lang-stats:" + USER;
      const TOKEN_KEY = "gh-lang-stats-token";
      const CACHE_TTL = 24 * 60 * 60 * 1000;
      const CONCURRENCY = 8;

      /* utility-class strings reused by the JS rendering layer (pure Tailwind, no custom selectors) */
      const CLS_LINK = "text-blue-600 hover:underline dark:text-[#58a6ff]";
      const CLS_MUTED = "text-gray-500 dark:text-[#8b949e]";
      const CLS_DOT = "inline-block w-2.5 h-2.5 rounded-full shrink-0";
      const CLS_REPO_ROW =
        "grid grid-cols-[minmax(120px,220px)_1fr_auto] gap-3 items-center py-2 border-t border-gray-200 first:border-t-0 dark:border-[#30363d]";
      const BANNER_BASE = "rounded-lg px-4 py-2.5 mb-4 text-[13px] border";
      const BANNER_VARIANTS = {
        error:
          "bg-red-50 text-red-700 border-red-300 dark:bg-red-500/10 dark:text-[#ff7b72] dark:border-[#ff7b72]",
        info: "bg-white text-gray-500 border-gray-200 dark:bg-[#161b22] dark:text-[#8b949e] dark:border-[#30363d]",
      };

      const store = {
        get(k) {
          try {
            return localStorage.getItem(k);
          } catch {
            return null;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, v);
          } catch {
            /* private mode */
          }
        },
        del(k) {
          try {
            localStorage.removeItem(k);
          } catch {
            /* private mode */
          }
        },
      };

      let token = store.get(TOKEN_KEY) || "";
      let donutChart = null,
        barChart = null;
      let lastAgg = null;
      let busy = false;

      /* ---------- helpers ---------- */
      /* Language name -> color. FNV-1a hash (with a splitmix32 finalizer,
         since FNV's low bits are weak) is decoded in OKLCH — a perceptually
         uniform space, so equal lightness actually looks equal — then
         converted to sRGB. Bit layout: [31..8] hue, [7..3] lightness,
         [2..0] chroma. */
      function hashName(str) {
        let h = 0x811c9dc5;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 0x01000193);
        }
        h ^= h >>> 16;
        h = Math.imul(h, 0x21f0aaad);
        h ^= h >>> 15;
        h = Math.imul(h, 0x735a2d97);
        h ^= h >>> 15;
        return h >>> 0;
      }

      function oklchToLin(L, C, hDeg) {
        const rad = (hDeg * Math.PI) / 180;
        const a = C * Math.cos(rad);
        const b = C * Math.sin(rad);
        const l = (L + 0.3963377774 * a + 0.2158037573 * b) ** 3;
        const m = (L - 0.1055613458 * a - 0.0638541728 * b) ** 3;
        const s = (L - 0.0894841775 * a - 1.291485548 * b) ** 3;
        return [
          4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
          -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
          -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s,
        ];
      }

      function langColor(name) {
        const h32 = hashName(name);
        const hue = ((h32 >>> 8) / 0xffffff) * 360;
        const L = 0.63 + (((h32 >>> 3) & 0x1f) / 31) * 0.12;
        let C = 0.105 + ((h32 & 0x7) / 7) * 0.045;
        // Gamut-map instead of clipping: shrink chroma until the color fits
        // sRGB, so hue and perceived lightness stay exactly as hashed.
        let lin = oklchToLin(L, C, hue);
        for (let i = 0; i < 10 && lin.some((v) => v < 0 || v > 1); i++) {
          C *= 0.9;
          lin = oklchToLin(L, C, hue);
        }
        const gamma = (c) => {
          c = Math.min(Math.max(c, 0), 1);
          return c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055;
        };
        const [r, g, b] = lin.map((c) => Math.round(gamma(c) * 255));
        return "rgb(" + r + "," + g + "," + b + ")";
      }

      function fmtBytes(n) {
        if (n < 1024) return n + " B";
        const units = ["KB", "MB", "GB", "TB"];
        let u = -1;
        do {
          n /= 1024;
          u++;
        } while (n >= 1024 && u < units.length - 1);
        return n.toFixed(n >= 100 ? 0 : n >= 10 ? 1 : 2) + " " + units[u];
      }

      function pct(n, total) {
        return total > 0 ? ((100 * n) / total).toFixed(1) + "%" : "0%";
      }

      const darkMQ = window.matchMedia("(prefers-color-scheme: dark)");

      function chartTheme() {
        return darkMQ.matches
          ? {
              fg: "#e6edf3",
              muted: "#8b949e",
              grid: "rgba(139, 148, 158, .15)",
            }
          : { fg: "#1f2328", muted: "#656d76", grid: "rgba(31, 35, 40, .1)" };
      }

      /* ---------- GitHub API ---------- */
      async function gh(path) {
        const headers = {
          Accept: "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28",
        };
        if (token) headers["Authorization"] = "Bearer " + token;
        const res = await fetch(API + path, { headers });
        if (
          (res.status === 403 || res.status === 429) &&
          res.headers.get("x-ratelimit-remaining") === "0"
        ) {
          const reset = Number(res.headers.get("x-ratelimit-reset"));
          const err = new Error("rate-limited");
          err.rateLimit = true;
          err.resetAt = reset ? new Date(reset * 1000) : null;
          throw err;
        }
        if (!res.ok) {
          const err = new Error(
            "GitHub API error " + res.status + " for " + path,
          );
          err.status = res.status;
          throw err;
        }
        return res.json();
      }

      async function collect(onProgress) {
        const profile = await gh("/users/" + USER).catch(() => null);

        const repos = [];
        for (let page = 1; page <= 30; page++) {
          const batch = await gh(
            "/users/" +
              USER +
              "/repos?per_page=100&page=" +
              page +
              "&type=owner&sort=full_name",
          );
          repos.push(...batch);
          if (batch.length < 100) break;
        }

        const skipForks = $("#skip-forks").is(":checked");
        const skipArchived = $("#skip-archived").is(":checked");
        const picked = repos.filter(
          (r) => (!skipForks || !r.fork) && (!skipArchived || !r.archived),
        );

        const out = new Array(picked.length);
        let next = 0,
          done = 0;
        const workers = Math.max(1, Math.min(CONCURRENCY, picked.length));
        await Promise.all(
          Array.from({ length: workers }, async () => {
            for (;;) {
              const i = next++;
              if (i >= picked.length) return;
              const repo = picked[i];
              let langs = {};
              try {
                langs = await gh(
                  "/repos/" +
                    USER +
                    "/" +
                    encodeURIComponent(repo.name) +
                    "/languages",
                );
              } catch (e) {
                if (e.rateLimit) throw e; // abort the whole run; keep partial gaps otherwise
              }
              out[i] = { name: repo.name, url: repo.html_url, langs };
              onProgress(++done, picked.length);
            }
          }),
        );

        return { profile, repos: out, skipForks, skipArchived };
      }

      function aggregate(data) {
        const totals = new Map();
        let totalBytes = 0;
        for (const r of data.repos) {
          for (const [lang, bytes] of Object.entries(r.langs)) {
            totals.set(lang, (totals.get(lang) || 0) + bytes);
            totalBytes += bytes;
          }
        }
        const languages = [...totals.entries()]
          .map(([name, bytes]) => ({ name, bytes }))
          .sort((a, b) => b.bytes - a.bytes);
        const repos = data.repos
          .map((r) => {
            const entries = Object.entries(r.langs).sort((a, b) => b[1] - a[1]);
            return {
              name: r.name,
              url: r.url,
              bytes: entries.reduce((s, [, b]) => s + b, 0),
              entries,
            };
          })
          .sort((a, b) => b.bytes - a.bytes);
        return { languages, repos, totalBytes, repoCount: data.repos.length };
      }

      /* ---------- rendering (jQuery) ---------- */
      function render(agg, data) {
        lastAgg = agg;

        if (data.profile) {
          if (data.profile.avatar_url)
            $("#avatar")
              .attr("src", data.profile.avatar_url)
              .removeClass("hidden");
          $("#title").text((data.profile.name || USER) + " · language stats");
        }
        $("#user-link")
          .text("@" + USER)
          .attr("href", "https://github.com/" + USER);
        document.title = "Language stats · " + USER;

        $("#stat-repos").text(agg.repoCount);
        $("#stat-langs").text(agg.languages.length);
        $("#stat-size").text(fmtBytes(agg.totalBytes));

        const $top = $("#stat-top").empty();
        if (agg.languages.length) {
          $top.append(
            $("<span>")
              .addClass(CLS_DOT)
              .css("background", langColor(agg.languages[0].name)),
          );
          $top.append(document.createTextNode(agg.languages[0].name));
        } else {
          $top.text("–");
        }

        renderCharts(agg);
        renderRepoTable(agg);
      }

      function renderCharts(agg) {
        if (!window.Chart) {
          showBanner(
            "error",
            "Chart.js failed to load from the CDN. Check your network and refresh.",
          );
          return;
        }
        const t = chartTheme();
        Chart.defaults.color = t.muted;
        Chart.defaults.borderColor = t.grid;

        if (donutChart) {
          donutChart.destroy();
          donutChart = null;
        }
        if (barChart) {
          barChart.destroy();
          barChart = null;
        }
        if (!agg.languages.length) return;

        const TOP_N = 9;
        const head = agg.languages.slice(0, TOP_N);
        const restBytes = agg.languages
          .slice(TOP_N)
          .reduce((s, l) => s + l.bytes, 0);
        const labels = head.map((l) => l.name);
        const values = head.map((l) => l.bytes);
        const colors = head.map((l) => langColor(l.name));
        if (restBytes > 0) {
          labels.push("Other");
          values.push(restBytes);
          colors.push(t.muted);
        }

        donutChart = new Chart($("#donut")[0], {
          type: "doughnut",
          data: {
            labels,
            datasets: [
              { data: values, backgroundColor: colors, borderWidth: 0 },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: "62%",
            plugins: {
              legend: {
                position: "bottom",
                labels: {
                  boxWidth: 12,
                  boxHeight: 12,
                  padding: 12,
                  color: t.fg,
                },
              },
              tooltip: {
                callbacks: {
                  label: (ctx) =>
                    " " +
                    ctx.label +
                    ": " +
                    fmtBytes(ctx.parsed) +
                    " (" +
                    pct(ctx.parsed, agg.totalBytes) +
                    ")",
                },
              },
            },
          },
        });

        const barTop = agg.languages.slice(0, 10);
        barChart = new Chart($("#bar")[0], {
          type: "bar",
          data: {
            labels: barTop.map((l) => l.name),
            datasets: [
              {
                data: barTop.map((l) => l.bytes),
                backgroundColor: barTop.map((l) => langColor(l.name)),
                borderRadius: 3,
                barThickness: 18,
              },
            ],
          },
          options: {
            indexAxis: "y",
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: (ctx) =>
                    " " +
                    fmtBytes(ctx.parsed.x) +
                    " · " +
                    pct(ctx.parsed.x, agg.totalBytes),
                },
              },
            },
            scales: {
              x: {
                ticks: { callback: (v) => fmtBytes(v) },
                grid: { color: t.grid },
              },
              y: { grid: { display: false }, ticks: { color: t.fg } },
            },
          },
        });
      }

      function renderRepoTable(agg) {
        const $repos = $("#repos").empty();
        const top = agg.repos.filter((r) => r.bytes > 0).slice(0, 12);
        if (!top.length) {
          $repos.append($("<p>").addClass(CLS_MUTED).text("No language data."));
          return;
        }
        for (const r of top) {
          const $bar = $("<div>").addClass(
            "flex h-2.5 rounded-[5px] overflow-hidden",
          );
          const segments = r.entries.slice(0, 5);
          for (const [lang, bytes] of segments) {
            $bar.append(
              $("<span>")
                .css({
                  width: (100 * bytes) / r.bytes + "%",
                  background: langColor(lang),
                })
                .attr("title", lang + " · " + pct(bytes, r.bytes)),
            );
          }
          const otherBytes = r.bytes - segments.reduce((s, [, b]) => s + b, 0);
          if (otherBytes > 0) {
            $bar.append(
              $("<span>")
                .css({
                  width: (100 * otherBytes) / r.bytes + "%",
                  background: "#8b949e",
                })
                .attr("title", "Other · " + pct(otherBytes, r.bytes)),
            );
          }

          $repos.append(
            $("<div>")
              .addClass(CLS_REPO_ROW)
              .append(
                $("<a>")
                  .addClass(CLS_LINK + " truncate text-[13px]")
                  .attr({
                    href: r.url,
                    target: "_blank",
                    rel: "noopener",
                    title: r.name,
                  })
                  .text(r.name),
                $bar,
                $("<span>")
                  .addClass(
                    "text-xs whitespace-nowrap tabular-nums " + CLS_MUTED,
                  )
                  .text(fmtBytes(r.bytes)),
              ),
          );
        }
      }

      /* ---------- UI plumbing ---------- */
      function showBanner(kind, text) {
        $("#banner")
          .attr("class", BANNER_BASE + " " + BANNER_VARIANTS[kind])
          .text(text);
      }
      function hideBanner() {
        $("#banner").attr("class", "hidden");
      }

      function progress(text) {
        $("#progress-text").text(text);
        $("#progress").removeClass("hidden").addClass("flex");
      }

      function setBusy(on) {
        if (on) $("#progress").removeClass("hidden").addClass("flex");
        else $("#progress").addClass("hidden").removeClass("flex");
        $("#refresh, #skip-forks, #skip-archived").prop("disabled", on);
      }

      async function load(force) {
        if (busy) return;
        busy = true;
        hideBanner();
        setBusy(true);
        const skipForks = $("#skip-forks").is(":checked");
        const skipArchived = $("#skip-archived").is(":checked");
        try {
          let data = null;
          if (!force) {
            try {
              const cached = JSON.parse(store.get(CACHE_KEY) || "null");
              if (
                cached &&
                cached.skipForks === skipForks &&
                cached.skipArchived === skipArchived &&
                Date.now() - cached.ts < CACHE_TTL
              ) {
                data = cached.data;
              }
            } catch {
              /* corrupt cache -> refetch */
            }
          }
          if (!data) {
            progress("Fetching profile…");
            data = await collect((done, total) =>
              progress("Scanning languages… " + done + "/" + total),
            );
            store.set(
              CACHE_KEY,
              JSON.stringify({ ts: Date.now(), skipForks, skipArchived, data }),
            );
          }
          const agg = aggregate(data);
          render(agg, data);
          if (!agg.languages.length)
            showBanner("info", "No language data found for this user.");
        } catch (e) {
          if (e.rateLimit) {
            showBanner(
              "error",
              "GitHub API rate limit hit" +
                (e.resetAt
                  ? " — resets at " + e.resetAt.toLocaleTimeString()
                  : "") +
                ". Add an API token above or try again later.",
            );
          } else if (e.status === 404) {
            showBanner("error", 'User "' + USER + '" not found on GitHub.');
          } else {
            showBanner("error", e.message);
          }
        } finally {
          busy = false;
          setBusy(false);
        }
      }

      /* ---------- init ---------- */
      $(function () {
        $("#user-link")
          .text("@" + USER)
          .attr("href", "https://github.com/" + USER);
        $("#token-input").val(token);

        $("#refresh").on("click", () => load(true));
        $("#skip-forks, #skip-archived").on("change", () => load(false));
        $("#token-toggle").on("click", () =>
          $("#token-panel").toggleClass("hidden flex"),
        );
        $("#token-save").on("click", () => {
          token = $("#token-input").val().trim();
          if (token) store.set(TOKEN_KEY, token);
          else store.del(TOKEN_KEY);
          $("#token-panel").addClass("hidden").removeClass("flex");
          load(true);
        });
        $("#token-clear").on("click", () => {
          token = "";
          $("#token-input").val("");
          store.del(TOKEN_KEY);
          load(true);
        });

        /* re-theme charts when the OS color scheme flips */
        darkMQ.addEventListener("change", () => {
          if (lastAgg) renderCharts(lastAgg);
        });

        load(false);
      });
    </script>
  </body>
</html>
