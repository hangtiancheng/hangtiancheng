# Start only what you need: docker compose up -d mysql redis
# Image versions were checked against upstream releases on 2026-10-06.
x-images:
  mysql: &mysql-image mysql:26.7.0
  redis: &redis-image redis:8.10.2-alpine
  mongo: &mongo-image mongo:9.0.2
  postgres: &postgres-image postgres:18.6-alpine
  nginx: &nginx-image nginx:1.31.6-alpine-slim
  ubuntu: &ubuntu-image ubuntu:26.04
  # MinIO Community is archived; this is the build recommended by Langfuse.
  minio: &minio-image cgr.dev/chainguard/minio:latest@sha256:a05a4497e8dce3cb7a7a1bf1872ba5d30ea988f1e8c22c9e0920503761c4b5f1
  mc: &mc-image cgr.dev/chainguard/minio-client:latest@sha256:487ea889cfb126aeb8d51405dd8d2f8426da33734a8369338814c4eebe0179e6
  # Both manifests report 4.53.0 and the same source revision.
  langfuse-web: &langfuse-web-image docker.langfuse.com/langfuse/langfuse:4@sha256:3ab2b36e54c5b6d424db43b3365689e8c2ef46f309dbb6a07c869213ef15a6d8
  langfuse-worker: &langfuse-worker-image docker.langfuse.com/langfuse/langfuse-worker:4@sha256:ebab1e2e314f6aace8040bcc1cd29f66a0407151dfa79c6cdb1ea5ef15ceb46f
  clickhouse: &clickhouse-image clickhouse/clickhouse-server:26.9.11.2-alpine
  etcd: &etcd-image quay.io/coreos/etcd:v3.7.2
  milvus: &milvus-image milvusdb/milvus:v3.0.2
  kafka: &kafka-image apache/kafka:4.3.1
  prometheus: &prometheus-image prom/prometheus:v3.15.0
  grafana: &grafana-image grafana/grafana:13.2.3

x-service: &service
  restart: unless-stopped
  logging: &logging
    driver: local
    options:
      max-size: "5m"
      max-file: "2"
      compress: "true"

x-langfuse-environment: &langfuse-environment
  NEXTAUTH_URL: ${LANGFUSE_BASE_URL:-http://localhost:3100}
  DATABASE_URL: postgresql://${POSTGRES_USER:-yukino}:${POSTGRES_PASSWORD:-yukino}@postgres:5432/${POSTGRES_DB:-yukino_agent}
  SALT: ${LANGFUSE_SALT:?Set LANGFUSE_SALT in .env}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?Set LANGFUSE_ENCRYPTION_KEY in .env}
  LANGFUSE_LOG_LEVEL: warn
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?Set LANGFUSE_CLICKHOUSE_PASSWORD in .env}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-12345678}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-12345678}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: redis
  REDIS_PORT: "6379"

x-langfuse-depends-on: &langfuse-depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  mc:
    condition: service_completed_successfully
  clickhouse:
    condition: service_healthy

services:
  # Databases: all persistent files stay under ./volumes/<service>/.
  mysql:
    <<: *service
    image: *mysql-image
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_DATABASE: db0
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
      MYSQL_ROOT_PASSWORD: pass
      TZ: Asia/Shanghai
    command:
      - --log-error-verbosity=2
      # Local development: avoid retaining replication binary logs.
      - --skip-log-bin
    volumes:
      - ./volumes/mysql/data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    <<: *service
    image: *redis-image
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - redis-server
      - --loglevel
      - warning
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - ./volumes/redis/data:/data
    healthcheck:
      test: ["CMD-SHELL", '[ "$$(redis-cli ping)" = PONG ]']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  mongo:
    <<: *service
    image: *mongo-image
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: db0
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: pass
    # MongoDB has no global warn threshold; quiet suppresses routine activity.
    command: ["mongod", "--quiet", "--setParameter", "diagnosticDataCollectionEnabled=false"]
    volumes:
      - ./volumes/mongo/data:/data/db
      - ./volumes/mongo/configdb:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", 'mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "quit(db.adminCommand({ping: 1}).ok ? 0 : 1)"']
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s

  postgres:
    <<: *service
    image: *postgres-image
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yukino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yukino}
      POSTGRES_DB: ${POSTGRES_DB:-yukino_agent}
    command:
      - postgres
      - -c
      - log_min_messages=warning
      - -c
      - log_min_error_statement=error
      - -c
      - logging_collector=off
      - -c
      - log_statement=none
    # PostgreSQL 18+ uses /var/lib/postgresql/18/docker as PGDATA.
    volumes:
      - ./volumes/postgres/data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Shared object storage for Langfuse and Milvus.
  minio:
    <<: *service
    image: *minio-image
    command: ["server", "--quiet", "--console-address", ":9001", "/data"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-12345678}
    volumes:
      - ./volumes/minio/data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  mc:
    image: *mc-image
    restart: "no"
    logging: *logging
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:-admin}:${MINIO_ROOT_PASSWORD:-12345678}@minio:9000
    command: ["--quiet", "mb", "--ignore-existing", "local/milvus", "local/langfuse"]

  # Tracing: docker compose up -d langfuse-web langfuse-worker
  langfuse-web:
    <<: *service
    image: *langfuse-web-image
    depends_on: *langfuse-depends-on
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      <<: *langfuse-environment
      HOSTNAME: 0.0.0.0
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?Set LANGFUSE_NEXTAUTH_SECRET in .env}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      LANGFUSE_INIT_ORG_ID: yukino-local
      LANGFUSE_INIT_ORG_NAME: Yukino Local
      LANGFUSE_INIT_PROJECT_ID: yukino
      LANGFUSE_INIT_PROJECT_NAME: Yukino
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_USER_EMAIL}
      LANGFUSE_INIT_USER_NAME: Yukino Developer
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_USER_PASSWORD}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/public/health?failIfDatabaseUnavailable=true').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 24
      start_period: 60s

  langfuse-worker:
    <<: *service
    image: *langfuse-worker-image
    depends_on: *langfuse-depends-on
    environment:
      <<: *langfuse-environment
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3030/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 24
      start_period: 60s

  clickhouse:
    <<: *service
    image: *clickhouse-image
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
    volumes:
      - ./volumes/clickhouse/data:/var/lib/clickhouse
      - ./docker/clickhouse/logging.xml:/etc/clickhouse-server/config.d/logging.xml:ro
    tmpfs:
      - /var/log/clickhouse-server:size=16m,uid=101,gid=101
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Vector storage: docker compose up -d milvus
  etcd:
    <<: *service
    image: *etcd-image
    command:
      - etcd
      - --name=etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
      - --auto-compaction-mode=revision
      - --auto-compaction-retention=1000
      - --quota-backend-bytes=536870912
      - --snapshot-count=10000
      - --max-snapshots=2
      - --max-wals=2
      - --log-level=warn
    volumes:
      - ./volumes/etcd/data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  milvus-volume-init:
    image: *milvus-image
    user: "0:0"
    network_mode: none
    read_only: true
    restart: "no"
    logging: *logging
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        uid="$$(id -u milvus)"
        gid="$$(id -g milvus)"
        chown -R "$$uid:$$gid" /var/lib/milvus
    volumes:
      - ./volumes/milvus/data:/var/lib/milvus

  milvus:
    <<: *service
    image: *milvus-image
    mem_limit: 2g
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-12345678}
      MINIO_REGION: us-east-1
      MQ_TYPE: woodpecker
    volumes:
      - ./volumes/milvus/data:/var/lib/milvus
      - ./docker/milvus/user.yaml:/milvus/configs/user.yaml:ro
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s
    depends_on:
      milvus-volume-init:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy
      mc:
        condition: service_completed_successfully

  # Message broker: host clients use localhost:9092; containers use kafka:19092.
  kafka:
    <<: *service
    image: *kafka-image
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Kafka data retention is per partition; this is not the application log.
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 268435456
      KAFKA_LOG_SEGMENT_BYTES: 67108864
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_LOG4J_OPTS: "-Dlog4j2.configurationFile=/etc/kafka/log4j2.yaml"
      KAFKA_GC_LOG_OPTS: "-Xlog:gc*=warning:stderr:time,tags"
    volumes:
      - ./volumes/kafka/data:/var/lib/kafka/data
      - ./volumes/kafka/secrets:/etc/kafka/secrets:ro
      - ./volumes/kafka/config:/mnt/shared/config
      - ./docker/kafka/log4j2.yaml:/etc/kafka/log4j2.yaml:ro
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:19092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 30s

  # HTTP and monitoring.
  nginx:
    <<: *service
    image: *nginx-image
    ports:
      - "127.0.0.1:8080:80"
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./volumes/nginx/html:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    <<: *service
    image: *prometheus-image
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./volumes/prometheus/data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --storage.tsdb.retention.size=512MB
      - --storage.tsdb.wal-compression
      - --log.level=warn
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  grafana:
    <<: *service
    image: *grafana-image
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: root
      GF_SECURITY_ADMIN_PASSWORD: pass
      GF_LOG_LEVEL: warn
      GF_LOG_MODE: console
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./volumes/grafana/data:/var/lib/grafana
      - ./docker/grafana/datasources.yml:/etc/grafana/provisioning/datasources/local.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      prometheus:
        condition: service_healthy

  # One Ubuntu LTS service, started explicitly when needed.
  ubuntu:
    <<: *service
    image: *ubuntu-image
    profiles: [tools]
    stdin_open: true
    tty: true
    command: ["/bin/bash"]
    working_dir: /workspace
    volumes:
      - ./volumes/ubuntu/workspace:/workspace
